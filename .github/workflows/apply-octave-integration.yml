name: Apply Octave Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply final Octave controller
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          encoded = ""

          path = Path("boringNotch/MediaControllers/NowPlayingController.swift")
          text = path.read_text()
          marker = "// MARK: - Octave Streaming web controller"
          if marker not in text:
              raise SystemExit("Octave controller marker missing")
          section = base64.b64decode(encoded).decode()
          path.write_text(text[:text.index(marker)] + section)
          PY

          git diff --check
          grep -q 'detectOctaveBrowser()' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'supportedBrowserBundleIdentifierPrefixes' boringNotch/MediaControllers/NowPlayingController.swift

      - name: Commit final controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boringNotch/MediaControllers/NowPlayingController.swift
          git commit -m "fix: decouple Octave tab detection from MediaRemote attribution"
          git push origin HEAD:fix/octave-brave-final
