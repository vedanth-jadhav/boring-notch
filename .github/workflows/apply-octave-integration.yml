name: Apply Octave and updater fix
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        default: fix/octave-detection-and-updater
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Apply source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, plistlib
          from pathlib import Path

          payloads = {
            "boringNotch/components/Settings/SoftwareUpdater.swift": "",
            "boringNotch/MediaControllers/NowPlayingController.swift": "",
            "BoringNotchXPCHelper/BoringNotchXPCHelper.swift": "",
            "boringNotch/XPCHelperClient/XPCHelperClient.swift": ""
          }
          for path, payload in payloads.items():
              Path(path).write_bytes(gzip.decompress(base64.b64decode(payload)))

          info = Path("boringNotch/Info.plist")
          with info.open("rb") as handle:
              plist = plistlib.load(handle)
          plist["NSAppleEventsUsageDescription"] = "Boring Notch checks supported browser tabs to identify music playing from Octave Streaming."
          plist["SUAutomaticallyUpdate"] = True
          plist["SUFeedURL"] = "https://github.com/vedanth-jadhav/boring-notch/releases/download/beta/appcast.xml"
          plist.pop("SUPublicEDKey", None)
          with info.open("wb") as handle:
              plistlib.dump(plist, handle, sort_keys=False)

          entitlements = Path("boringNotch/boringNotch.entitlements")
          with entitlements.open("rb") as handle:
              plist = plistlib.load(handle)
          targets = plist.setdefault("com.apple.security.temporary-exception.apple-events", [])
          for bundle in ["com.apple.Safari", "com.google.Chrome", "com.brave.Browser", "com.microsoft.edgemac"]:
              if bundle not in targets:
                  targets.append(bundle)
          with entitlements.open("wb") as handle:
              plistlib.dump(plist, handle, sort_keys=False)

          app = Path("boringNotch/boringNotchApp.swift")
          text = app.read_text()
          text = text.replace("startingUpdater: true, updaterDelegate: nil, userDriverDelegate: nil)", "startingUpdater: false, updaterDelegate: nil, userDriverDelegate: nil)")
          marker = "SettingsWindowController.shared.setUpdaterController(updaterController)"
          if "ForkReleaseUpdater.shared.start()" not in text:
              text = text.replace(marker, marker + "\n        Task { @MainActor in\n            ForkReleaseUpdater.shared.start()\n        }")
          app.write_text(text)

          method = "    // Stages a verified beta DMG and launches a detached installer that replaces this app after exit.\n    func prepareUpdateInstallation(fromDMGPath dmgPath: String, currentAppPath: String, hostPID: Int32, with reply: @escaping (Bool) -> Void)\n"
          for protocol_path in [Path("BoringNotchXPCHelper/BoringNotchXPCHelperProtocol.swift"), Path("boringNotch/XPCHelperClient/BoringNotchXPCHelperProtocol.swift")]:
              text = protocol_path.read_text()
              if "prepareUpdateInstallation" not in text:
                  text = text.replace("}\n", method + "}\n")
                  protocol_path.write_text(text)
          PY
          git diff --check
      - name: Restore workflow and commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/apply-octave-integration.yml
          git add boringNotch BoringNotchXPCHelper .github/workflows/apply-octave-integration.yml
          git diff --cached --check
          git commit -m "Fix Octave runtime detection and fork updater"
          git push origin "HEAD:${{ inputs.source_ref }}"
