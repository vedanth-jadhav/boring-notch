name: Apply Octave Integration

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit to patch"
        required: true

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Restore release-compatible Octave marker name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('boringNotch/MediaControllers/NowPlayingController.swift')
          text = path.read_text()
          old = 'supportedBrowserBundleIdentifierPrefixes'
          new = 'supportedBrowserBundleIdentifiers'
          if text.count(old) != 2:
              raise SystemExit(f'Expected exactly two prefix-marker references, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          grep -q 'supportedBrowserBundleIdentifiers' boringNotch/MediaControllers/NowPlayingController.swift
          git diff --check
      - name: Restore workflow and commit source compatibility fix
        run: |
          git checkout 49490f39137f8f86f491379cb2f8b5a3a61d82e6 -- .github/workflows/apply-octave-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-octave-integration.yml boringNotch/MediaControllers/NowPlayingController.swift
          git diff --cached --check
          git commit -m 'Restore Octave release validation marker compatibility'
          git push origin "HEAD:${{ inputs.source_ref }}"
