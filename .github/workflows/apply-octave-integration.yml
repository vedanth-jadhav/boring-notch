name: Apply Octave and updater root fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Apply finished source pass
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64

          PUBLIC_KEY = "TSol7IeX5WPhq/ubD0i6+6MFpZmJwRqgOBQ39fWa1nU="
          FEED = "https://github.com/vedanth-jadhav/boring-notch/releases/download/beta/appcast.xml"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Replace the entire Octave provider section atomically. This removes the circular
          # dependency on MediaRemote's browser bundle attribution and coalesces slow tab checks.
          octave_section = base64.b64decode("").decode()
          path = Path("boringNotch/MediaControllers/NowPlayingController.swift")
          text = path.read_text()
          marker = "// MARK: - Octave Streaming web controller"
          if marker not in text:
              raise SystemExit("Octave controller marker missing")
          path.write_text(text[:text.index(marker)] + octave_section)

          replace_once(
              "boringNotch/Info.plist",
              "\t<key>SUAutomaticallyUpdate</key>\n\t<false/>",
              "\t<key>SUAutomaticallyUpdate</key>\n\t<true/>\n\t<key>SUAllowsAutomaticUpdates</key>\n\t<true/>\n\t<key>SUScheduledCheckInterval</key>\n\t<integer>3600</integer>",
          )
          replace_once("boringNotch/Info.plist", "https://TheBoredTeam.github.io/boring.notch/appcast.xml", FEED)
          replace_once("boringNotch/Info.plist", "B1Y47t8C/v8ImurYA+9arEsuCrpxwJSviekiflMElbI=", PUBLIC_KEY)

          replace_once(
              "boringNotch/components/Settings/SoftwareUpdater.swift",
              "import SwiftUI\nimport Sparkle\n",
              '''import SwiftUI
          import Sparkle

          /// The fork publishes prereleases on Sparkle's `beta` channel. Sparkle only
          /// considers the default channel unless the updater delegate explicitly opts in.
          final class BoringNotchUpdaterDelegate: NSObject, SPUUpdaterDelegate {
              func allowedChannels(for updater: SPUUpdater) -> Set<String> {
                  ["beta"]
              }
          }
          ''',
          )
          replace_once(
              "boringNotch/components/Settings/SoftwareUpdater.swift",
              'Toggle("Automatically download updates", isOn: $automaticallyDownloadsUpdates)',
              'Toggle("Automatically download and install updates", isOn: $automaticallyDownloadsUpdates)',
          )

          replace_once(
              "boringNotch/boringNotchApp.swift",
              '''    let updaterController: SPUStandardUpdaterController

              init() {
                  updaterController = SPUStandardUpdaterController(
                      startingUpdater: true, updaterDelegate: nil, userDriverDelegate: nil)
          ''',
              '''    let updaterDelegate: BoringNotchUpdaterDelegate
              let updaterController: SPUStandardUpdaterController

              init() {
                  let updaterDelegate = BoringNotchUpdaterDelegate()
                  self.updaterDelegate = updaterDelegate
                  updaterController = SPUStandardUpdaterController(
                      startingUpdater: true, updaterDelegate: updaterDelegate, userDriverDelegate: nil)

                  // Migrate installs that inherited the upstream fork's disabled auto-download default.
                  // Do this once so later user choices in Settings remain respected.
                  let updaterDefaultsMigrationKey = "BoringNotchForkUpdaterDefaultsV1"
                  if !UserDefaults.standard.bool(forKey: updaterDefaultsMigrationKey) {
                      updaterController.updater.automaticallyChecksForUpdates = true
                      updaterController.updater.automaticallyDownloadsUpdates = true
                      UserDefaults.standard.set(true, forKey: updaterDefaultsMigrationKey)
                  }
          ''',
          )

          replace_once(
              "Scripts/package_swift_cli.sh",
              '''MARKETING_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ROOT/boringNotch/Info.plist" 2>/dev/null || echo "1.0")
          BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ROOT/boringNotch/Info.plist" 2>/dev/null || echo "1")
          ''',
              '''PBXPROJ="$ROOT/boringNotch.xcodeproj/project.pbxproj"
          MARKETING_VERSION="${MARKETING_VERSION:-$(sed -n 's/.*MARKETING_VERSION = \\([^;]*\\);.*/\\1/p' "$PBXPROJ" | head -1)}"
          BUILD_NUMBER="${BUILD_NUMBER:-$(sed -n 's/.*CURRENT_PROJECT_VERSION = \\([^;]*\\);.*/\\1/p' "$PBXPROJ" | head -1)}"
          [[ -n "$MARKETING_VERSION" ]] || { echo "ERROR: unable to resolve MARKETING_VERSION from $PBXPROJ" >&2; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid CURRENT_PROJECT_VERSION '$BUILD_NUMBER'" >&2; exit 1; }
          ''',
          )
          replace_once(
              "Scripts/package_swift_cli.sh",
              '''  <key>SUEnableInstallerLauncherService</key>
            <true/>
            <key>SUFeedURL</key>
            <string>https://TheBoredTeam.github.io/boring.notch/appcast.xml</string>
            <key>SUPublicEDKey</key>
            <string>B1Y47t8C/v8ImurYA+9arEsuCrpxwJSviekiflMElbI=</string>
          ''',
              f'''  <key>SUEnableInstallerLauncherService</key>
            <true/>
            <key>SUEnableAutomaticChecks</key>
            <true/>
            <key>SUAutomaticallyUpdate</key>
            <true/>
            <key>SUAllowsAutomaticUpdates</key>
            <true/>
            <key>SUScheduledCheckInterval</key>
            <integer>3600</integer>
            <key>SUFeedURL</key>
            <string>{FEED}</string>
            <key>SUPublicEDKey</key>
            <string>{PUBLIC_KEY}</string>
          ''',
          )

          replace_once(
              ".github/workflows/beta_release.yml",
              '/usr/libexec/PlistBuddy -c "Set :SUAutomaticallyUpdate false" boringNotch/Info.plist',
              '/usr/libexec/PlistBuddy -c "Set :SUAutomaticallyUpdate true" boringNotch/Info.plist',
          )
          replace_once(
              ".github/workflows/beta_release.yml",
              "          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' \"$APP/Contents/Info.plist\" >/dev/null",
              f'''          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist")" = "{PUBLIC_KEY}"
                    test "$(/usr/libexec/PlistBuddy -c 'Print :SUAutomaticallyUpdate' "$APP/Contents/Info.plist")" = "true"''',
          )

          replace_once(
              ".github/workflows/manual_build.yml",
              '''      - name: Detect Sparkle signing capability
                  run: |
                    set -euo pipefail
                    # The repository already contains an upstream appcast. Never let that historical
                    # feed masquerade as a freshly signed beta feed merely because it exists on disk.
                    rm -rf updater
                    if [[ -n "$SPARKLE_PRIVATE_KEY" ]]; then
                      echo "SPARKLE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
                      echo "Sparkle private key is available; publishing a signed beta appcast."
                    else
                      echo "SPARKLE_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
                      echo "::warning::PRIVATE_SPARKLE_KEY is not configured. The validated DMG will still be released, but no unsigned/insecure Sparkle appcast will be published."
                    fi
          ''',
              '''      - name: Require Sparkle signing key
                  run: |
                    set -euo pipefail
                    # A beta without a signed appcast looks releasable but silently breaks both
                    # "Check for Updates" and scheduled updates. Refuse to publish that state.
                    rm -rf updater
                    if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
                      echo "::error::PRIVATE_SPARKLE_KEY is required to publish Boring Notch Beta."
                      exit 1
                    fi
                    echo "SPARKLE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          ''',
          )
          replace_once(
              ".github/workflows/manual_build.yml",
              '''          assets=("Release/${BETA_DMG_NAME}" "Release/${BETA_DMG_NAME}.sha256")
                    notes="Beta ${VERSION}: Octave Streaming integration, media-control/seek fixes, Octave-first romanised lyrics, performance work, and macOS 26.5 validation."
                    if [[ -f updater/appcast.xml ]]; then
                      assets+=(updater/appcast.xml)
                      notes+=" Secure Sparkle auto-update feed is included."
                    else
                      notes+=" Auto-update code is wired to the beta release channel, but the signed appcast is intentionally not published until the repository owner provisions PRIVATE_SPARKLE_KEY matching the app's SUPublicEDKey."
                    fi
          ''',
              '''          test -f updater/appcast.xml
                    assets=("Release/${BETA_DMG_NAME}" "Release/${BETA_DMG_NAME}.sha256" "updater/appcast.xml")
                    notes="Beta ${VERSION}: Octave Streaming integration, media-control/seek fixes, Octave-first romanised lyrics, performance work, and signed Sparkle auto-updates."
          ''',
          )
          replace_once(
              ".github/workflows/manual_build.yml",
              '''          if [[ "$SPARKLE_SIGNING_AVAILABLE" == "true" ]]; then
                      echo "$asset_names" | grep -Fx 'appcast.xml'
                      curl -fL --retry 4 --retry-delay 3 \\
                        "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BETA_TAG}/appcast.xml" \\
                        -o "$RUNNER_TEMP/published-appcast.xml"
                      grep -q 'sparkle:edSignature' "$RUNNER_TEMP/published-appcast.xml"
                    else
                      if echo "$asset_names" | grep -Fxq 'appcast.xml'; then
                        echo "::error::Unsigned/stale appcast.xml was unexpectedly published."
                        exit 1
                      fi
                    fi
          ''',
              '''          echo "$asset_names" | grep -Fx 'appcast.xml'
                    curl -fL --retry 4 --retry-delay 3 \\
                      "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BETA_TAG}/appcast.xml" \\
                      -o "$RUNNER_TEMP/published-appcast.xml"
                    grep -q 'sparkle:edSignature' "$RUNNER_TEMP/published-appcast.xml"
          ''',
          )
          PY

          # Keep the staging workflow out of the PR tree.
          git checkout origin/main -- .github/workflows/apply-octave-integration.yml
          git diff --check
          git status --short

      - name: Commit finished pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "spotify-ci"
          git config user.email "spotify-ci@users.noreply.github.com"
          git add boringNotch/MediaControllers/NowPlayingController.swift \
                  boringNotch/Info.plist \
                  boringNotch/components/Settings/SoftwareUpdater.swift \
                  boringNotch/boringNotchApp.swift \
                  Scripts/package_swift_cli.sh \
                  .github/workflows/beta_release.yml \
                  .github/workflows/manual_build.yml \
                  .github/workflows/apply-octave-integration.yml
          git commit -m "fix: make Octave detection and fork updater reliable"
          git push origin HEAD:fix/octave-updater-runtime
