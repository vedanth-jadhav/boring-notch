name: Restore NowPlaying Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/octave-streaming-integration-clean
          fetch-depth: 0
      - name: Restore verified source and apply descriptor unwrap
        run: |
          set -euo pipefail
          git show ecb644ed2f3eef4600712a0ab068faaf3ee84853:boringNotch/MediaControllers/NowPlayingController.swift > boringNotch/MediaControllers/NowPlayingController.swift
          python3 - <<'PY'
          from pathlib import Path
          path = Path('boringNotch/MediaControllers/NowPlayingController.swift')
          text = path.read_text()
          old = 'if try await AppleScriptHelper.execute(candidate.script).booleanValue {'
          new = 'if let descriptor = try await AppleScriptHelper.execute(candidate.script), descriptor.booleanValue {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one descriptor access anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boringNotch/MediaControllers/NowPlayingController.swift
          git commit -m 'Restore NowPlaying source with descriptor unwrap'
          git push origin HEAD:feat/octave-streaming-integration-clean
