name: Apply Octave Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/octave-streaming-integration-clean
          fetch-depth: 0
      - name: Apply integration
        run: python3 Scripts/apply_octave_integration.py
      - name: Verify patch markers
        run: |
          grep -q 'case octaveStreaming' boringNotch/models/Constants.swift
          grep -q 'OctaveStreamingController' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'Octave Lyric Provider' boringNotch/managers/Lyrics/LyricFeverLyricsService.swift
          git diff --check
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add boringNotch/models/Constants.swift boringNotch/managers/MusicManager.swift boringNotch/MediaControllers/NowPlayingController.swift boringNotch/managers/Lyrics/LyricFeverLyricsService.swift
          git diff --cached --quiet || git commit -m 'Integrate Octave streaming provider'
          git push origin HEAD:feat/octave-streaming-integration-clean
      - name: Build with Xcode 27 preview
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer || true
          xcodebuild -project boringNotch.xcodeproj -scheme boringNotch -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
