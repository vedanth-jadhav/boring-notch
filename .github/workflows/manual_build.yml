name: "Manual Build"
on:
  workflow_dispatch:
    inputs:
      head_ref:
        description: 'Branch to build'
        required: false
        default: main
      version:
        description: 'Marketing version (optional)'
        required: false
      build_number:
        description: 'Build number (optional)'
        required: false
      xcode_version:
        description: 'Xcode version (optional)'
        required: false
        default: '26.6'
      publish_beta:
        description: 'Publish the validated DMG as the Boring Notch Beta GitHub prerelease'
        required: false
        type: boolean
        default: false
      artifact_run_id:
        description: 'Optional completed workflow run ID whose boringNotch.dmg artifact should be published without rebuilding'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event.inputs.artifact_run_id == '' }}
    name: Build and sign app
    uses: ./.github/workflows/build_reusable.yml
    with:
      head_ref: ${{ github.event.inputs.head_ref || github.ref_name || 'main' }}
      version: ${{ github.event.inputs.version || '' }}
      build_number: ${{ github.event.inputs.build_number || '' }}
      xcode_version: ${{ github.event.inputs.xcode_version || '26.6' }}
      code_sign_identity: "Apple Development"
    secrets:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD:              ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD:         ${{ secrets.KEYCHAIN_PASSWORD }}

  publish_beta:
    name: Publish Boring Notch Beta
    needs: build
    if: ${{ always() && github.event.inputs.publish_beta == 'true' && (needs.build.result == 'success' || github.event.inputs.artifact_run_id != '') }}
    runs-on: macos-26
    permissions:
      actions: read
      contents: write
    env:
      PROJECT_NAME: boringNotch
      BETA_TAG: beta
      BETA_DMG_NAME: Boring Notch Beta.dmg
      VERSION: ${{ github.event.inputs.version || '2.7.6' }}
      HEAD_REF: ${{ github.event.inputs.head_ref || github.ref_name }}
      XCODE_VERSION: ${{ github.event.inputs.xcode_version || '26.6' }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
      ARTIFACT_RUN_ID: ${{ github.event.inputs.artifact_run_id }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Require Sparkle signing key
        run: |
          set -euo pipefail
          # A beta without a signed appcast looks releasable but silently breaks both
          # "Check for Updates" and scheduled updates. Refuse to publish that state.
          rm -rf updater
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "::error::PRIVATE_SPARKLE_KEY is required to publish Boring Notch Beta."
            exit 1
          fi
          echo "SPARKLE_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"

      - name: Select Xcode for Sparkle tooling
        if: ${{ env.SPARKLE_SIGNING_AVAILABLE == 'true' }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          sw_vers

      - name: Download DMG from this workflow run
        if: ${{ env.ARTIFACT_RUN_ID == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release

      - name: Validate supplied artifact workflow run
        if: ${{ env.ARTIFACT_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          EXPECTED_SHA="$(git rev-parse HEAD)"
          RUN_JSON="$(gh run view "$ARTIFACT_RUN_ID" --json workflowName,headSha,conclusion)"
          SOURCE_WORKFLOW="$(jq -r '.workflowName' <<<"$RUN_JSON")"
          SOURCE_SHA="$(jq -r '.headSha' <<<"$RUN_JSON")"
          SOURCE_CONCLUSION="$(jq -r '.conclusion' <<<"$RUN_JSON")"
          [[ "$SOURCE_WORKFLOW" == "Manual Build" ]] || { echo "::error::Artifact run must come from Manual Build, got: $SOURCE_WORKFLOW"; exit 1; }
          [[ "$SOURCE_CONCLUSION" == "success" ]] || { echo "::error::Artifact run did not succeed: $SOURCE_CONCLUSION"; exit 1; }
          [[ "$SOURCE_SHA" == "$EXPECTED_SHA" ]] || { echo "::error::Artifact run head SHA $SOURCE_SHA does not match intended HEAD_REF $EXPECTED_SHA"; exit 1; }
          RUN_LOG="$(gh run view "$ARTIFACT_RUN_ID" --log)"
          if ! grep -F "Set version to v${VERSION}" <<<"$RUN_LOG" >/dev/null; then
            PROJECT_VERSION="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' "${PROJECT_NAME}.xcodeproj/project.pbxproj" | head -1)"
            [[ "$PROJECT_VERSION" == "$VERSION" ]] || { echo "::error::Requested version ${VERSION} does not match project version ${PROJECT_VERSION}"; exit 1; }
            grep -F "Set build number to " <<<"$RUN_LOG" >/dev/null || { echo "::error::Artifact run does not record a compatible version/build update"; exit 1; }
          fi

      - name: Download DMG from validated workflow run
        if: ${{ env.ARTIFACT_RUN_ID != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PROJECT_NAME }}.dmg
          path: Release
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare named beta DMG
        run: |
          set -euo pipefail
          test -f "Release/${PROJECT_NAME}.dmg"
          mv "Release/${PROJECT_NAME}.dmg" "Release/${BETA_DMG_NAME}"
          shasum -a 256 "Release/${BETA_DMG_NAME}" | tee "Release/${BETA_DMG_NAME}.sha256"
          cat > "Release/Boring Notch Beta.html" <<HTML
          <h1>Boring Notch Beta ${VERSION}</h1>
          <p>Octave Streaming browser detection and transport controls, seek synchronization hardening, Octave-first lyrics with romanisation, performance improvements, and macOS 26.5 validation.</p>
          HTML

      - name: Build pinned Sparkle appcast tool
        if: ${{ env.SPARKLE_SIGNING_AVAILABLE == 'true' }}
        run: |
          set -euo pipefail
          SPARKLE_METADATA_PATH="${PROJECT_NAME}.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          SPARKLE_SRC="$RUNNER_TEMP/Sparkle"
          SPARKLE_DERIVED="$RUNNER_TEMP/sparkle-derived"
          SPARKLE_REPO_URL="https://github.com/sparkle-project/Sparkle"

          IFS=$'\t' read -r SPARKLE_VERSION SPARKLE_REVISION <<< "$(python3 - "$SPARKLE_METADATA_PATH" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          sparkle = next((pin for pin in data.get('pins', []) if pin.get('identity') == 'sparkle'), None)
          if sparkle is None:
              print(f"::error::No Sparkle pin found in {path}", file=sys.stderr)
              sys.exit(1)
          state = sparkle.get('state', {})
          version = state.get('version')
          revision = state.get('revision')
          if not version or not revision:
              print(f"::error::Sparkle pin is incomplete in {path}", file=sys.stderr)
              sys.exit(1)
          print(f"{version}\t{revision}")
          PY
          )"

          SPARKLE_TAG=""
          for candidate in "$SPARKLE_VERSION" "v$SPARKLE_VERSION"; do
            if git ls-remote --exit-code --tags "$SPARKLE_REPO_URL" "refs/tags/$candidate" >/dev/null; then
              SPARKLE_TAG="$candidate"
              break
            else
              status=$?
              if [[ "$status" -ne 2 ]]; then
                echo "::error::Unable to query Sparkle tag $candidate"
                exit 1
              fi
            fi
          done
          [[ -n "$SPARKLE_TAG" ]] || { echo "::error::No Sparkle tag for ${SPARKLE_VERSION}"; exit 1; }

          git clone --depth 1 --branch "$SPARKLE_TAG" --single-branch "$SPARKLE_REPO_URL" "$SPARKLE_SRC"
          ACTUAL_REVISION="$(git -C "$SPARKLE_SRC" rev-parse HEAD)"
          [[ "$ACTUAL_REVISION" == "$SPARKLE_REVISION" ]] || {
            echo "::error::Sparkle revision mismatch: ${ACTUAL_REVISION} != ${SPARKLE_REVISION}"
            exit 1
          }

          xcodebuild -project "$SPARKLE_SRC/Sparkle.xcodeproj" \
            -scheme generate_appcast \
            -configuration Release \
            -derivedDataPath "$SPARKLE_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build
          APPCAST_BIN="$SPARKLE_DERIVED/Build/Products/Release/generate_appcast"
          [[ -x "$APPCAST_BIN" ]] || { echo "::error::generate_appcast was not built"; exit 1; }
          install -m 0755 "$APPCAST_BIN" "$RUNNER_TEMP/generate_appcast"

      - name: Generate signed beta appcast
        if: ${{ env.SPARKLE_SIGNING_AVAILABLE == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p updater
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/generate_appcast" \
            --ed-key-file - \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${BETA_TAG}" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BETA_TAG}/" \
            --embed-release-notes \
            --channel beta \
            -o updater/appcast.xml \
            Release/
          grep -q 'sparkle:edSignature' updater/appcast.xml
          grep -q 'Boring%20Notch%20Beta.dmg\|Boring Notch Beta.dmg' updater/appcast.xml

      - name: Publish beta GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f updater/appcast.xml
          assets=("Release/${BETA_DMG_NAME}" "Release/${BETA_DMG_NAME}.sha256" "updater/appcast.xml")
          notes="Beta ${VERSION}: Octave Streaming integration, media-control/seek fixes, Octave-first romanised lyrics, performance work, and signed Sparkle auto-updates."

          if gh release view "$BETA_TAG" >/dev/null 2>&1; then
            gh release upload "$BETA_TAG" "${assets[@]}" --clobber
          else
            gh release create "$BETA_TAG" \
              "${assets[@]}" \
              --target "$HEAD_REF" \
              --title "Boring Notch Beta" \
              --notes "$notes" \
              --prerelease
          fi

      - name: Verify published beta assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$BETA_TAG" --json tagName,name,isPrerelease,url,assets)"
          echo "$release_json"
          asset_names="$(gh release view "$BETA_TAG" --json assets --jq '.assets[].name')"
          echo "$asset_names" | grep -E '^Boring[ .]Notch[ .]Beta\.dmg$'
          echo "$asset_names" | grep -Fx 'appcast.xml'
          curl -fL --retry 4 --retry-delay 3 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${BETA_TAG}/appcast.xml" \
            -o "$RUNNER_TEMP/published-appcast.xml"
          grep -q 'sparkle:edSignature' "$RUNNER_TEMP/published-appcast.xml"
