name: Build for macOS

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Boring Notch (macOS 26.5, Xcode 26.6)
    runs-on: macos-26
    steps:
      - name: Code Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          XCODE_PATH="/Applications/Xcode_26.6.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26.6 not found at ${XCODE_PATH}"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sw_vers
          xcrun --show-sdk-version

      - name: Repair project membership
        run: |
          set -euo pipefail
          python3 Scripts/fix_project_membership.py
          git diff --exit-code -- boringNotch.xcodeproj/project.pbxproj

      - name: Swift CLI validation
        run: |
          set -euo pipefail
          swift --version
          xcrun swiftc -parse boringNotch/models/Constants.swift
          xcrun swiftc -parse boringNotch/components/Onboarding/MusicControllerSelectionView.swift
          xcrun swiftc -parse boringNotch/MediaControllers/NowPlayingController.swift
          xcrun swiftc -parse boringNotch/managers/MusicManager.swift
          xcrun swiftc -parse boringNotch/managers/Lyrics/LyricFeverLyricsService.swift
          xcrun swiftc -parse boringNotch/components/Lyrics/LockScreenLyricLineView.swift

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj

      - name: Build universal Release app
        run: |
          set -o pipefail
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"
          BIN="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Release/boringNotch.app/Contents/MacOS/boringNotch' -print -quit)"
          test -n "$BIN"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHS"
          grep -q 'arm64' <<<"$ARCHS"
          grep -q 'x86_64' <<<"$ARCHS"

      - name: Reject integration warnings
        run: |
          set -euo pipefail
          ! grep -E 'warning:.*(OctaveStreamingController|LyricFeverOctaveLyricProvider|NowPlayingController|ThermalDetailMonitor|LyricRomanizationService|BudsAppModel)' "$RUNNER_TEMP/xcodebuild.log"
