name: "Reusable Build"
on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: false
        type: string
      xcode_version:
        required: false
        type: string
        default: "16.4"
      code_sign_identity:
        required: false
        type: string
        default: "Apple Development"
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      PROJECT_NAME: boringNotch
      XCODE_VERSION: ${{ inputs.xcode_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0

      - name: Apply and verify Octave integration
        if: ${{ hashFiles('Scripts/apply_octave_integration.py') != '' }}
        run: |
          python3 Scripts/apply_octave_integration.py
          grep -q 'case octaveStreaming' boringNotch/models/Constants.swift
          grep -q 'OctaveStreamingController' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'Octave Lyric Provider' boringNotch/managers/Lyrics/LyricFeverLyricsService.swift
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boringNotch/models/Constants.swift boringNotch/managers/MusicManager.swift boringNotch/MediaControllers/NowPlayingController.swift boringNotch/managers/Lyrics/LyricFeverLyricsService.swift
          git diff --cached --quiet || git commit -m 'Integrate Octave streaming provider'
          git push origin "HEAD:${{ inputs.head_ref }}"

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} not found at ${XCODE_PATH}"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sw_vers

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ${{ env.PROJECT_NAME }}.xcodeproj

      - name: Compile app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ${{ env.PROJECT_NAME }}.xcodeproj \
            -scheme ${{ env.PROJECT_NAME }} \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify no Octave integration warnings
        run: |
          ! grep -E 'warning:.*(OctaveStreamingController|LyricFeverOctaveLyricProvider|NowPlayingController)' "$RUNNER_TEMP/xcodebuild.log"
