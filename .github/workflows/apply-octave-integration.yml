name: Apply final Octave fallback
on:
  workflow_dispatch:
    inputs:
      source_ref:
        required: true
        default: fix/octave-detection-and-updater
permissions:
  contents: write
jobs:
  apply-fix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Harden unavailable browser fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('boringNotch/MediaControllers/NowPlayingController.swift')
          text = path.read_text()
          pattern = r'''if Self\.isSupportedBrowserBundleIdentifier\(state\.bundleIdentifier\),\s*state\.isPlaying \|\| !state\.title\.trimmingCharacters\(in: \.whitespacesAndNewlines\)\.isEmpty \{'''
          replacement = '''if state.isPlaying || !state.title.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
                        // `.unavailable` means at least one supported browser is running but every
                        // attempted browser automation request failed. Chromium helper/PWA owners
                        // need not use the browser's canonical MediaRemote bundle identifier.'''
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one fallback guard, replaced {count}')
          path.write_text(text)
          PY
          git diff --check
      - name: Restore workflow and commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/apply-octave-integration.yml
          git add boringNotch/MediaControllers/NowPlayingController.swift .github/workflows/apply-octave-integration.yml
          git diff --cached --check
          git commit -m "Handle blocked browser automation for Octave media"
          git push origin "HEAD:${{ inputs.source_ref }}"
