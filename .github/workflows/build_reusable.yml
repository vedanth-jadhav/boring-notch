name: "Reusable Build"
on:
  workflow_call:
    inputs:
      head_ref:
        required: true
        type: string
      version:
        required: false
        type: string
      build_number:
        required: false
        type: string
      xcode_version:
        required: false
        type: string
        default: "16.4"
      code_sign_identity:
        required: false
        type: string
        default: "Apple Development"
    secrets:
      BUILD_CERTIFICATE_BASE64:
        required: false
      P12_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    env:
      PROJECT_NAME: boringNotch
      XCODE_VERSION: ${{ inputs.xcode_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0

      - name: Apply project membership repair and validate source state
        run: |
          python3 Scripts/fix_project_membership.py
          grep -q 'case octaveStreaming' boringNotch/models/Constants.swift
          grep -q 'OctaveStreamingController' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'supportedBrowserBundleIdentifiers' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'Octave Lyric Provider' boringNotch/managers/Lyrics/LyricFeverLyricsService.swift
          grep -q 'LyricRomanizationService.swift in Sources' boringNotch.xcodeproj/project.pbxproj
          grep -q 'BudsAppModel.swift in Sources' boringNotch.xcodeproj/project.pbxproj
          grep -q 'ThermalDetailMonitor.swift in Sources' boringNotch.xcodeproj/project.pbxproj
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boringNotch.xcodeproj/project.pbxproj boringNotch/managers/SystemStatsMonitor.swift
          git diff --cached --quiet || git commit -m 'Restore missing Xcode source membership'
          git push origin "HEAD:${{ inputs.head_ref }}"

      - name: Probe Octave lyric implementation
        run: |
          python3 - <<'PY'
          import re, urllib.parse, urllib.request
          base = 'https://music.octavestreaming.com'
          params = urllib.parse.urlencode({'title': "Choosin' Texas", 'artist': 'Ella Langley'})
          try:
              req = urllib.request.Request(f'{base}/api/lyrics?{params}', headers={'Accept':'application/json','User-Agent':'boringNotch-ci'})
              with urllib.request.urlopen(req, timeout=10) as r:
                  print('OCTAVE_LYRICS_STATUS', r.status)
                  print('OCTAVE_LYRICS_BODY', r.read(1000).decode('utf-8','replace').replace('\n',' '))
          except Exception as exc:
              print('OCTAVE_LYRICS_PROBE_ERROR', repr(exc))
          try:
              html = urllib.request.urlopen(base+'/', timeout=10).read().decode('utf-8','replace')
              scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html)
              print('OCTAVE_SCRIPT_COUNT', len(scripts))
              for src in scripts:
                  asset = urllib.parse.urljoin(base+'/', src)
                  try: js = urllib.request.urlopen(asset, timeout=10).read().decode('utf-8','replace')
                  except Exception: continue
                  low = js.lower()
                  for token in ('lyrics','lrclib','musixmatch'):
                      p = low.find(token)
                      if p >= 0:
                          print('OCTAVE_JS_HINT', token, asset, js[max(0,p-160):p+500].replace('\n',' ')[:800])
                          break
          except Exception as exc:
              print('OCTAVE_JS_INSPECTION_ERROR', repr(exc))
          PY

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} not found at ${XCODE_PATH}"
            ls -d /Applications/Xcode*.app 2>/dev/null || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          sw_vers

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ${{ env.PROJECT_NAME }}.xcodeproj

      - name: Compile universal macOS app without signing
        run: |
          set -o pipefail
          xcodebuild -project ${{ env.PROJECT_NAME }}.xcodeproj -scheme ${{ env.PROJECT_NAME }} -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Verify integration warnings
        run: |
          ! grep -E 'warning:.*(OctaveStreamingController|LyricFeverOctaveLyricProvider|NowPlayingController|ThermalDetailMonitor|LyricRomanizationService|BudsAppModel)' "$RUNNER_TEMP/xcodebuild.log"
