name: Apply Octave Integration

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or commit to patch"
        required: true

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Apply Brave background detection fix
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/octave-brave.patch
          git apply --check -p2 /tmp/octave-brave.patch
          git apply -p2 /tmp/octave-brave.patch
          grep -q 'process.arguments = \[scriptURL.path, frameworkPath, "get", "--now"\]' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'reconciliationTask = Task' boringNotch/MediaControllers/NowPlayingController.swift
          grep -q 'bundleIdentifier.hasPrefix(prefix + ".")' boringNotch/MediaControllers/NowPlayingController.swift
      - name: Restore workflow and commit source fix
        run: |
          git checkout 028b32df97cd58aec12cee1a5e97c5662de49f7d -- .github/workflows/apply-octave-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-octave-integration.yml boringNotch/MediaControllers/NowPlayingController.swift
          git diff --cached --check
          git commit -m 'Fix Octave detection for Brave background playback'
          git push origin "HEAD:${{ inputs.source_ref }}"
